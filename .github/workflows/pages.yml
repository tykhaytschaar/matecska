# MATECSKA - build + GitHub Pages deploy
#
# Minden main-re torteno push: GBDK-2020 letoltese, ROM forditas, nativ
# teszt, jatszooldal generalasa - ellenorzeskent (nem elesit).
# DEPLOY CSAK v* TAG PUSHOLASAKOR: a web/ mappa (index.html + matecska.gb)
# publikalasa GitHub Pages-re. Az almos.me Netlify proxyval erre a
# Pages-re mutat, ezert ott nem kell semmit deployolni.
name: pages

on:
  push:
    branches: [main]      # csak build + teszt
    tags: ['v*']          # build + teszt + DEPLOY
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # teljes history + tagek a git describe-hoz

      - name: GBDK-2020 (linux64)
        run: |
          curl -sL -o gbdk.tar.gz \
            https://github.com/gbdk-2020/gbdk-2020/releases/latest/download/gbdk-linux64.tar.gz
          tar xzf gbdk.tar.gz -C "$HOME"      # -> $HOME/gbdk
          "$HOME/gbdk/bin/lcc" -v 2>&1 | head -2 || true

      - name: Nativ teszt (mathgen)
        run: make test

      - name: ROM + jatszooldal
        run: |
          make GBDK_HOME="$HOME/gbdk"
          make web GBDK_HOME="$HOME/gbdk"
          ls -la web/

      - uses: actions/upload-pages-artifact@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          path: web

  deploy:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
